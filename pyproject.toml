[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "orgindex-schema"
# Version is derived from the git tag by hatch-vcs (see [tool.hatch.version]).
# The package MAJOR tracks SCHEMA_VERSION's major; see COMPATIBILITY.md.
dynamic = ["version"]
description = "Canonical, versioned pydantic schema for the organizational data comprehensive index (the on-disk contract between the cyborg producer and cyborg-data consumers). Primarily for internal Red Hat / openshift-eng use."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Continuous Release Tooling - Red Hat" },
    { name = "Eris Hoxha", email = "ehoxha@redhat.com" },
]
maintainers = [{ name = "Eris Hoxha", email = "ehoxha@redhat.com" }]
keywords = ["organizational-data", "index", "schema", "contract"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "mypy>=1.13,<2.0", "ruff>=0.6,<0.9"]

[project.urls]
Homepage = "https://github.com/openshift-eng/orgindex-schema"
Repository = "https://github.com/openshift-eng/orgindex-schema"
Changelog = "https://github.com/openshift-eng/orgindex-schema/blob/main/CHANGELOG.md"
Issues = "https://github.com/openshift-eng/orgindex-schema/issues"

[tool.hatch.version]
source = "vcs"

# Don't hard-fail a build in a checkout without tags (e.g. a CI image built from a
# shallow clone); real releases always build from a tag, which takes precedence.
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/orgindex_schema"]

[tool.hatch.build.targets.sdist]
# Ship the sources needed to rebuild and verify the contract, nothing else.
include = ["src", "tests", "scripts", "schema", "index.schema.json", "Makefile", "COMPATIBILITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
# Repo root on the path so tests can import the `scripts` tooling package.
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orgindex_schema", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP", "RUF", "N", "PGH"]
