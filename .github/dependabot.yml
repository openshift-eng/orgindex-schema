version: 2
updates:
  # Keep GitHub Actions pinned by SHA and up to date (security-relevant).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # One batched PR per run instead of one per action.
    groups:
      github-actions:
        patterns: ["*"]
    # Let a release settle before proposing it; wait longer for majors.
    cooldown:
      default-days: 7
      semver-major-days: 30

  # Watch the runtime/dev dependency bounds (notably the pydantic floor).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 30
