name: CI

on:
  pull_request:
  push:
    branches: [main, "release-*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # hatch-vcs derives the version from tags; a full history is required.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      # Fail CI if the committed uv.lock is stale.
      - run: uv lock --check
      # lint + format-check + typecheck + test + schema drift + breaking-change gate.
      - run: make all

  minimum-versions:
    # Verify the declared dependency floors (e.g. pydantic>=2.7) actually work,
    # by resolving each direct dependency to its lowest allowed version.
    name: minimum versions
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - run: uv run --resolution lowest-direct --extra dev pytest
